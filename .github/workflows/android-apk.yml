name: Build AI CORE APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compiler l’APK
        run: gradle --no-daemon assembleDebug
      - name: Publier l’APK à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: AI-CORE-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
